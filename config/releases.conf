# Which TrueNAS releases to build Wi-Fi bundles for, and the Debian release
# each one is built on (must match the TrueNAS base so toolchain, pahole/BTF
# and the wpa_supplicant/iw packages line up).
#
# <tag regex (ERE, matched against truenas/linux tags)>   <debian release>
^TS-25\.10\.[0-9.]+$                                        bookworm
^TS-2[6-9]\.[0-9]+\.[0-9.]+$                                trixie
# Uncomment to also follow betas / release candidates:
#^TS-2[6-9]\.[0-9.]+-(BETA|RC)\.[0-9]+$                     trixie

# Only consider tags at or after this one (avoids building years of history
# the first time the watcher runs).
MIN_TAG TS-25.10.8
