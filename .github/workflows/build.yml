name: build bundle

on:
  workflow_call:
    inputs:
      tag:    { type: string, required: true }
      debian: { type: string, required: true }
      rev:    { type: number, required: true }
  workflow_dispatch:
    inputs:
      tag:    { description: "TrueNAS tag, e.g. TS-25.10.8", type: string, required: true }
      debian: { description: "bookworm (25.10) / trixie (26+)", type: string, default: trixie }
      rev:    { description: "bundle revision", type: number, default: 1 }
      skip_scst: { description: "skip SCST (only if you never use iSCSI)", type: boolean, default: false }

permissions:
  contents: write
  issues: write

jobs:
  build:
    # A full TrueNAS kernel (all modules + debug info + BTF) takes ~3h on a
    # 4-core hosted runner. Set the repo variable BUILD_RUNNER to e.g.
    # '["self-hosted","linux","x64"]' to use a faster self-hosted machine.
    runs-on: ${{ vars.BUILD_RUNNER && fromJSON(vars.BUILD_RUNNER) || 'ubuntu-latest' }}
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space (hosted runner)
        if: ${{ !vars.BUILD_RUNNER }}
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost
          sudo docker image prune -af >/dev/null
          df -h / /mnt

      - name: Prepare work dir
        run: |
          work=/mnt/tnwifi
          if ! sudo mkdir -p "$work" 2>/dev/null; then work=$HOME/tnwifi; mkdir -p "$work"; fi
          sudo mkdir -p "$work/out" "$work/build/bundle" && sudo chmod -R 777 "$work"
          echo "WORKDIR=$work" >> "$GITHUB_ENV"
          echo "OUT=$work/out" >> "$GITHUB_ENV"

      # The kernel is ~2h of the build. Cache its packages so a failure in a
      # later stage (ZFS/SCST/firmware/publish) retries in minutes. The key
      # covers everything that changes the kernel; bump "kernel-v1" if the
      # kernel part of scripts/build.sh changes.
      - name: Restore kernel packages
        id: kcache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.WORKDIR }}/build/bundle/linux-*.deb
          key: kernel-v1-${{ inputs.tag }}-r${{ inputs.rev }}-${{ hashFiles('config/wifi.config', 'patches/**') }}

      - name: Build in debian:${{ inputs.debian }}
        run: |
          docker run --rm \
            -e BUNDLE_REV=${{ inputs.rev }} \
            -e SKIP_SCST=${{ inputs.skip_scst && '1' || '0' }} \
            -e REUSE_KERNEL=${{ steps.kcache.outputs.cache-hit == 'true' && '1' || '0' }} \
            -e WORK=/work/build \
            -v "$PWD:/src:ro" -v "$WORKDIR:/work" \
            debian:${{ inputs.debian }} \
            /src/scripts/ci-container.sh "${{ inputs.tag }}" /work/out 2>&1 | tee build.log
          exit "${PIPESTATUS[0]}"

      - name: Check for kernel packages
        id: kpk
        if: always()
        run: |
          if ls "$WORKDIR"/build/bundle/linux-image-truenas-production-amd64_*.deb >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; fi

      - name: Save kernel packages
        if: always() && steps.kcache.outputs.cache-hit != 'true' && steps.kpk.outputs.exists == 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.WORKDIR }}/build/bundle/linux-*.deb
          key: kernel-v1-${{ inputs.tag }}-r${{ inputs.rev }}-${{ hashFiles('config/wifi.config', 'patches/**') }}

      - name: List output
        run: ls -la "$OUT"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          name="truenas-wifi-${{ inputs.tag }}-r${{ inputs.rev }}"
          tar -xOf "$OUT/$name.tar" ./manifest.json > manifest.json
          {
            echo "Wi-Fi (Intel BE200) kernel bundle for TrueNAS **${{ inputs.tag }}**, revision ${{ inputs.rev }}."
            echo
            echo "Kernel release: \`$(jq -r .kernel_release manifest.json)\`"
            echo
            echo '| package | version |'; echo '|---|---|'
            jq -r '.debs[] | "| \(.package) | \(.version) |"' manifest.json
            echo
            echo "Install on the NAS with \`truenas-wifi sync\` (automatic) or \`truenas-wifi install $name.tar\`."
          } > notes.md
          gh release create "wifi-${{ inputs.tag }}-r${{ inputs.rev }}" \
            "$OUT/$name.tar" "$OUT/$name.tar.sha256" manifest.json \
            --title "$name" --notes-file notes.md

      - name: Open an issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Build failed: ${{ inputs.tag }} r${{ inputs.rev }}"
          if gh issue list --state open --search "\"$title\" in:title" --json number -q '.[0].number' | grep -q .; then exit 0; fi
          {
            echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo
            echo "If a patch under \`patches/linux/\` no longer applies, rebase it onto the new tag and push; the watcher rebuilds automatically."
            echo
            echo '<details><summary>last 80 log lines</summary>'; echo; echo '```'
            tail -80 build.log 2>/dev/null || true
            echo '```'; echo '</details>'
          } > body.md
          gh issue create --title "$title" --body-file body.md
